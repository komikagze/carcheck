# .github/workflows/weekly.yml
#
# Снимает зависимость от постоянно включённого домашнего компьютера: раз в неделю
# GitHub-хостед раннер сам:
#   1. Скачивает накопленную БД с прошлой недели из GitHub Release (тег db-latest,
#      см. ниже "Хранение БД: GitHub Release, а не git" — почему не коммит).
#   2. Тянет данные Минтранса постранично через JSON API (package_show -> collector.py).
#   3. Дифает их с накопленной SQLite-базой.
#   4. Собирает сайт в export/dist/: статика public/ + серверный worker/index.js
#      + wrangler.jsonc (конфиг деплоя).
#   5. Заливает обновлённую БД обратно в GitHub Release (тег db-latest).
#   6. Публикует export/dist/ в ветку gh-pages — оттуда Cloudflare Workers Builds
#      забирает её и деплоит воркер `carcheck`.
#   7. Заливает накопленную историю по машинам в Turso — ТОЛЬКО туда,
#      не в статические файлы сайта (см. ниже, почему).
#
# ПОЧЕМУ TURSO, А НЕ CLOUDFLARE KV (важный урок первого реального прогона):
#   Изначально история заливалась в Cloudflare KV. На живом прогоне выяснилось,
#   что на бесплатном тарифе KV разрешает всего 1000 операций записи В СУТКИ,
#   а машин у нас ~2.4 млн — заливка падала с 429 и не могла завершиться
#   в принципе. Перебрали альтернативы (разбор в README): Supabase и Neon
#   отпали по объёму (0.5 ГБ), Cloudflare D1 подошёл бы, но там 100 тыс.
#   строк в сутки — первая заливка растянулась бы на ~25 дней. У Turso
#   бесплатно 5 ГБ, 10 млн записей строк в МЕСЯЦ и 500 млн чтений, и это
#   тот же SQLite, что и в локальной базе сборщика.
#
# ХРАНЕНИЕ БД: GITHUB RELEASE, А НЕ GIT (обнаружено на первом реальном прогоне):
#
#   БД на реальном объёме данных (2.4М+ строк current_state, 5.2М+ строк ownership)
#   весит 600+ МБ и продолжит расти. GitHub жёстко блокирует git push файлов
#   больше 100 МБ (без Git LFS), а обычный git-коммит такого файла КАЖДУЮ неделю
#   ещё и раздувал бы историю репозитория на сотни МБ еженедельно навсегда.
#   Поэтому БД хранится отдельно от git — как ассет GitHub Release с фиксированным
#   тегом db-latest (лимит GitHub на размер ассета релиза — 2 ГБ, без квоты трафика,
#   в отличие от Git LFS). Каждый прогон перезаписывает этот же ассет (--clobber).
#   Локальная копия (collector/db/carcheck.sqlite3 на своём компьютере) в git
#   тоже не попадает (см. .gitignore) — она просто живёт на диске сама по себе,
#   независимо от того, что происходит в Actions, и служит запасной копией.
#
# Компьютер пользователя нужен только один раз — чтобы запушить репозиторий на
# GitHub и настроить Cloudflare Pages + Turso. Дальше всё крутится само
# по расписанию.
#
# АРХИТЕКТУРА ДОСТАВКИ ДАННЫХ (см. README, раздел "Деплой: Cloudflare Pages + Turso"):
#
#   - Репозиторий, код и сам сайт — полностью публичные, без всякого логина.
#     Живой поиск по data.gov.il доступен всем как есть — это открытые госданные.
#   - НАКОПЛЕННАЯ сборщиком история (показания одометра по датам тестов, смена
#     номера двигателя, аномалии пробега, подробный журнал изменений) — тоже
#     должна быть доступна любому посетителю ПРИ ПОИСКЕ КОНКРЕТНОГО НОМЕРА
#     (это главная ценность инструмента), но не должна быть доступна для
#     массовой выгрузки всей базы разом.
#   - Раньше это пытались решить публичными JSON-шардами (dist/data/XXX.json)
#     под Cloudflare Access — но и шарды сами по себе перебираемы скриптом
#     (300-999 файлов), и Access либо закрывает всё (не подходит), либо ничего
#     не даёт при точечном публичном доступе. Оба варианта отклонены.
#   - Сейчас: история отдаётся ТОЛЬКО поштучно через Cloudflare Worker
#     (export/dist_template/worker/index.js), который делает
#     SELECT по одному номеру в Turso. Способа перечислить/выгрузить всю базу
#     через сайт не существует. Сама функция вдобавок ограничивает число
#     запросов с одного IP в минуту (рейт-лимит в таблице rate_limit) — это
#     не железная защита, а именно то, что описано в README: делает перебор
#     всего диапазона номеров практически нецелесообразным, не более того.
#   - Наполняет базу шаг "Upload accumulated history to Turso" ниже —
#     через export/turso_upload.py и HTTP API Turso, без node/npm.

name: Weekly carcheck collector + export

on:
  schedule:
    # Каждый понедельник в 03:00 UTC (~06:00 по Израилю летом, ~05:00 зимой).
    # Поменять время — поменять cron ниже.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}   # ручной запуск из вкладки Actions -> Run workflow

permissions:
  contents: write   # нужно, чтобы workflow мог публиковать/обновлять GitHub Release и пушить gh-pages

concurrency:
  group: carcheck-weekly
  cancel-in-progress: false   # не обрывать сборщик на середине скачивания

jobs:
  collect-and-export:
    runs-on: ubuntu-latest
    # Обычный еженедельный прогон укладывается в ~10-15 минут. Большой запас нужен
    # для ПЕРВОЙ заливки в Turso: там уезжает ~4.9 млн строк со скоростью
    # ~50 тыс./мин, то есть около 100 минут. Если и этого не хватит — не беда,
    # заливка возобновляемая (см. export/turso_upload.py): следующий прогон
    # продолжит с того места, где остановился, а не начнёт заново.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download previous database from GitHub Release (db-latest), если уже есть
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p collector/db
          gh release download db-latest --repo "${{ github.repository }}" \
            --pattern carcheck.sqlite3 --dir collector/db --clobber \
            || echo "Релиза db-latest ещё нет — это первый прогон, БД создастся с нуля."

      - name: Run collector (package_show -> постраничная загрузка через JSON API -> диф -> SQLite)
        run: python collector/collector.py

      - name: Run export (собрать статический сайт в export/dist, без данных по машинам)
        run: python export/export.py

      - name: Upload updated database to GitHub Release (db-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view db-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload db-latest collector/db/carcheck.sqlite3 \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create db-latest collector/db/carcheck.sqlite3 \
              --repo "${{ github.repository }}" \
              --title "carcheck: накопленная база (авто-обновление)" \
              --notes "Служебный ассет — перезаписывается еженедельно workflow'ом weekly.yml. Не предназначен для просмотра людьми; текущее состояние сайта смотрите на самом сайте."
          fi

      - name: Publish export/dist to gh-pages (статика + worker + wrangler.jsonc, БЕЗ данных по машинам)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./export/dist
          publish_branch: gh-pages
          keep_files: false
          commit_message: "weekly export"

      # ВЫКЛЮЧАТЕЛЬ ЗАЛИВКИ В TURSO.
      #
      # Поставлен "false" 14.08.2026: месячная квота записей выбрана на 98%
      # (9 758 196 из 10 млн). Считать надо было не строки, а строки ВМЕСТЕ
      # с индексными записями — Turso тарифицирует их наравне, то есть ~2
      # единицы квоты на строку. Полная заливка стоит ~9.8 млн, всю месячную
      # квоту разом. Счётчик обнуляется 1 сентября 2026.
      #
      # Превышение лимита на бесплатном тарифе блокирует ВЕСЬ аккаунт, а не
      # только запись, поэтому до обнуления сюда лучше не ходить вообще.
      #
      # ПОЧЕМУ ВЫКЛЮЧЕН ТОЛЬКО ЭТОТ ШАГ, А НЕ ВЕСЬ WORKFLOW: сбор данных должен
      # продолжаться. Источник публикует только ТЕКУЩИЙ срез, поэтому пропущенную
      # неделю не восстановить ничем — снимок за неё будет потерян навсегда.
      # Сборщик и заливка базы в Release продолжают работать, накапливая историю;
      # в Turso она уедет после обнуления квоты, разом за всё пропущенное время.
      #
      # Перед тем как вернуть "true", надо сократить объём заливки (иначе
      # сентябрьская квота выгорит так же за один прогон) — см. HANDOFF §4.1.
      - name: Upload accumulated history to Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_UPLOAD_ENABLED: "false"
        run: |
          if [ "$TURSO_UPLOAD_ENABLED" != "true" ]; then
            echo "[turso] Заливка пропущена: выключатель TURSO_UPLOAD_ENABLED=$TURSO_UPLOAD_ENABLED."
            echo "[turso] Причина — исчерпана месячная квота записей, обнуление 01.09.2026."
            echo "[turso] Сбор данных при этом отработал штатно, история копится в базе."
            exit 0
          fi
          python export/turso_upload.py
        # Если секреты ещё не заведены — скрипт сам это обнаружит, аккуратно
        # пропустит загрузку и объяснит, что нужно настроить (см. README), а не
        # уронит весь workflow с невнятной ошибкой.

      - name: Upload run log as artifact (для отладки, если сборщик упал)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-log
          path: collector/logs/collector.log
          if-no-files-found: ignore
          retention-days: 14
